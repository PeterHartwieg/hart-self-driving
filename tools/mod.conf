# The mod's name as players see it: the options header, a notice, the manifest's DisplayName and the README title.
# Change it with tools/rename-mod.sh "<new name>", which writes every one of those; tools/package-mod.sh refuses a
# package where they disagree. The mod id (DrivenRides: folder, DLL, namespace) stays as it is.
MOD_NAME="HART. Self Driving"
# The package folder, which is also the mod's title in the game's list of local mods.
MOD_FOLDER="DrivenRides"
# The game's internal build from Player.log, used by the Workshop uploader; not Steam's depot build ID.
GAME_BUILD="3682"
